# Router-based permissions configuration
# Layers: global -> roles -> agents -> workflow/phase
# More specific layers override less specific ones
# Superblocked rules cannot be overridden
#
# All tools go through the router. Tool names here are router tool names
# (without mcp__router__ prefix). Native Claude Code tools are blocked
# by native-tool-blocking.py hook — they never reach the router.

global:
  # Default allowed tools for all callers (router tool names)
  allowed: [Task, serena__*, native__read_file, native__glob, native__grep, native__bash, native__web_fetch, native__web_search, workflow__*, context7__*, router__*]
  # Default blocked tools (can be overridden by more specific layers)
  blocked: [native__write_file, native__edit_file, playwright__*]
  # Never overridable - always blocked
  superblocked: [native__bash(rm -rf*), native__bash(sudo*), native__bash(chmod 777*), native__bash(curl*|*sh), native__bash(wget*|*sh)]

roles:
  # All socket callers are subagents — block workflow state modification
  subagent:
    blocked: [workflow__workflow_start, workflow__workflow_stop, workflow__workflow_update, workflow__workflow_set_state, workflow__workflow_set_value, Bash(mcp-native*)]

  # Read-only access for research agents
  read_only:
    allowed: [native__read_file, native__glob, native__grep, serena__read_file, serena__find_file, serena__search_for_pattern, serena__list_dir, serena__get_symbols_overview, serena__find_symbol]
    blocked: [native__write_file, native__edit_file, native__bash]

  # Editor role for implementation
  editor:
    allowed: [native__write_file, native__edit_file, serena__replace_content, serena__replace_symbol_body, serena__create_text_file, serena__insert_after_symbol, serena__insert_before_symbol]
    blocked: []

  # Shell access for testing
  shell_safe:
    allowed: [native__bash(pytest*), native__bash(python -m pytest*), native__bash(ruff*), native__bash(black*), native__bash(mypy*)]
    blocked: []

  # Full shell access (dangerous)
  shell_full:
    allowed: [native__bash]
    blocked: []

  # Workflow control (orchestrator only)
  workflow_control:
    allowed: [workflow__*]
    blocked: []

agents:
  # Explorer - research only
  explorer:
    allowed: [native__read_file, native__glob, native__grep, serena__*, context7__*, native__bash(git log*), native__bash(git show*), native__bash(git diff*), native__bash(git status*), native__bash(git branch*), native__bash(ls*), native__bash(tree*), native__bash(wc*), native__bash(file*)]
    blocked: [native__write_file, native__edit_file, workflow__workflow_start, workflow__workflow_stop, workflow__workflow_update, workflow__workflow_set_state, workflow__workflow_set_value]

  # Implementer - can edit code, uses mcp-call via Bash
  implementer:
    allowed: [native__write_file, native__edit_file, native__read_file, native__glob, native__grep, native__bash(pytest*), native__bash(python*), native__bash(ruff*), native__bash(mcp-call*), serena__*]
    blocked: [workflow__workflow_start, workflow__workflow_stop, workflow__workflow_update, workflow__workflow_set_state, workflow__workflow_set_value, native__bash(rm*), native__bash(git push*)]

  # Orchestrator - delegates to subagents, no editing
  orchestrator:
    allowed: [native__read_file, native__glob, native__grep, workflow__*]
    blocked: [native__write_file, native__edit_file, native__bash]

  # Researcher - web and code research
  researcher:
    allowed: [native__read_file, native__glob, native__grep, serena__find_symbol, serena__find_referencing_symbols, serena__get_symbols_overview, serena__search_for_pattern, serena__read_file, serena__list_dir, context7__*, native__web_fetch, native__web_search]
    blocked: [native__write_file, native__edit_file, native__bash]

  # Reviewer - read-only analysis
  reviewer:
    allowed: [native__read_file, native__glob, native__grep, serena__*]
    blocked: [native__write_file, native__edit_file, native__bash]

  # Debugger - can read and run tests
  debugger:
    allowed: [native__read_file, native__glob, native__grep, native__bash(pytest*), native__bash(python*), native__bash(ruff*), native__bash(black*), native__bash(mypy*), serena__*]
    blocked: [native__write_file, native__edit_file]

  # Adversary - test quality evaluation (writes via serena__*, project-scoped)
  adversary:
    allowed: [native__read_file, native__glob, native__grep, native__bash(pytest*), native__bash(python*), native__bash(ruff*), serena__*]
    blocked: [native__bash(rm*), native__bash(git push*), workflow__workflow_start, workflow__workflow_stop, workflow__workflow_update, workflow__workflow_set_state, workflow__workflow_set_value]

  # Architect - planning and design (serena__create_text_file for docs/plans)
  architect:
    allowed: [native__read_file, native__glob, native__grep, serena__*, context7__*, native__web_fetch, native__web_search]
    blocked: [native__write_file, native__edit_file, native__bash]

  # Git-agent - branch/PR/merge operations
  git-agent:
    allowed: [native__read_file, native__glob, native__grep, native__bash(git*), native__bash(gh*)]
    blocked: [native__write_file, native__edit_file]

  # PM - stakeholder proxy, read + workflow control
  pm:
    allowed: [native__read_file, native__glob, native__grep, serena__*, workflow__*, context7__*]
    blocked: [native__write_file, native__edit_file, native__bash]

workflows:
  # Iterate workflow (TDD-style)
  iterate:
    orchestrate:
      allowed: [native__read_file, native__glob, native__grep, workflow__*]
      blocked: [native__write_file, native__edit_file, native__bash]

    test_writing:
      allowed: [native__write_file, native__edit_file, native__read_file, native__glob, native__grep, native__bash(pytest*), serena__*]
      blocked: []

    implement:
      allowed: [native__write_file, native__edit_file, native__read_file, native__glob, native__grep, native__bash(pytest*), native__bash(python*), native__bash(ruff*), serena__*]
      blocked: []

    test:
      allowed: [native__read_file, native__bash(pytest*), native__bash(python -m pytest*), native__bash(ruff*)]
      blocked: [native__write_file, native__edit_file]

    coverage:
      allowed: [native__write_file, native__edit_file, native__read_file, native__glob, native__grep, native__bash(pytest*), serena__*]
      blocked: []

    review:
      allowed: [native__read_file, native__glob, native__grep, native__bash(git*), native__bash(gh*), native__bash(mcp-call*)]
      blocked: [native__write_file, native__edit_file]

  # Debug workflow
  debug:
    triage:
      allowed: [native__read_file, native__glob, native__grep, native__bash(pytest*), serena__*]
      blocked: [native__write_file, native__edit_file]

    investigate:
      allowed: [native__read_file, native__glob, native__grep, native__bash(pytest*), native__bash(python*), serena__*]
      blocked: [native__write_file, native__edit_file]

    fix:
      allowed: [native__write_file, native__edit_file, native__read_file, native__glob, native__grep, native__bash(pytest*), serena__*]
      blocked: []

    verify:
      allowed: [native__read_file, native__bash(pytest*)]
      blocked: [native__write_file, native__edit_file]

  # PR review workflow
  pr_review:
    analyze:
      allowed: [native__read_file, native__glob, native__grep, native__bash(gh pr*), serena__*]
      blocked: [native__write_file, native__edit_file, native__bash]

    comment:
      allowed: [native__read_file, native__bash(gh pr comment*), native__bash(gh pr review*)]
      blocked: [native__write_file, native__edit_file]

  # Develop workflow (PR-based SE team)
  develop:
    intake:
      allowed: [native__read_file, native__glob, native__grep, serena__*, workflow__*]
      blocked: [native__write_file, native__edit_file, native__bash]
    research:
      allowed: [native__read_file, native__glob, native__grep, serena__*, context7__*, native__web_fetch, native__web_search]
      blocked: [native__write_file, native__edit_file, native__bash]
    design:
      allowed: [native__read_file, native__glob, native__grep, serena__*, context7__*]
      blocked: [native__write_file, native__edit_file, native__bash]
    branch:
      allowed: [native__read_file, native__bash(git*)]
      blocked: [native__write_file, native__edit_file]
    test_writing:
      allowed: [native__write_file, native__edit_file, native__read_file, native__glob, native__grep, native__bash(pytest*), serena__*]
      blocked: []
    implement:
      allowed: [native__write_file, native__edit_file, native__read_file, native__glob, native__grep, native__bash(pytest*), native__bash(python*), native__bash(ruff*), serena__*]
      blocked: []
    test:
      allowed: [native__read_file, native__bash(pytest*), native__bash(python -m pytest*), native__bash(ruff*)]
      blocked: [native__write_file, native__edit_file]
    review:
      allowed: [native__read_file, native__glob, native__grep, serena__*]
      blocked: [native__write_file, native__edit_file, native__bash]
    merge:
      allowed: [native__read_file, native__bash(git*), native__bash(gh*)]
      blocked: [native__write_file, native__edit_file]
    acceptance:
      allowed: [native__read_file, native__glob, native__grep, serena__*, workflow__*]
      blocked: [native__write_file, native__edit_file, native__bash]

  # Experiment workflow
  experiment:
    read:
      allowed: [native__read_file, native__glob, native__grep, serena__*]
      blocked: [native__write_file, native__edit_file, native__bash]
    plan:
      allowed: [native__read_file, native__glob, native__grep, serena__*, context7__*, native__web_fetch, native__web_search]
      blocked: [native__write_file, native__edit_file, native__bash]
    work:
      allowed: [native__write_file, native__edit_file, native__read_file, native__glob, native__grep, native__bash(pytest*), native__bash(python*), native__bash(ruff*), serena__*]
      blocked: []
    eval:
      allowed: [native__read_file, native__bash(pytest*), native__bash(python*)]
      blocked: [native__write_file, native__edit_file]
    journal:
      allowed: [native__read_file, native__write_file, native__glob]
      blocked: [native__edit_file, native__bash]
    decide:
      allowed: [native__read_file, native__glob, native__grep]
      blocked: [native__write_file, native__edit_file, native__bash]

  # Simple workflow — lightweight default
  simple:
    plan:
      allowed: [native__read_file, native__glob, native__grep, serena__read_file, serena__find_file, serena__search_for_pattern, serena__list_dir, serena__get_symbols_overview, serena__find_symbol, workflow__*]
      blocked: [native__write_file, native__edit_file, native__bash, serena__create_text_file, serena__replace_content, serena__replace_symbol_body]
    work:
      allowed: [native__write_file, native__edit_file, native__read_file, native__glob, native__grep, native__bash, serena__*]
      blocked: []
    verify:
      allowed: [native__read_file, native__glob, native__grep, native__bash(pytest*), native__bash(python*), native__bash(ruff*), native__bash(git*), serena__read_file, serena__find_file, serena__search_for_pattern]
      blocked: [native__write_file, native__edit_file, serena__create_text_file, serena__replace_content, serena__replace_symbol_body]
    done:
      allowed: []
      blocked: []
