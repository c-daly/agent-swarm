name: demo-data-structures
base_branch: dev
max_agents: 3
max_retries: 2
tasks:
  - name: stack
    module_path: src/stack.py
    test_path: tests/test_stack.py
    description: "Thread-safe stack with push, pop, peek, is_empty, size, clear"
    min_tests: 10
  - name: queue
    module_path: src/queue.py
    test_path: tests/test_queue.py
    description: "FIFO queue with enqueue, dequeue, peek, is_empty, size, clear"
    min_tests: 10
  - name: linked_list
    module_path: src/linked_list.py
    test_path: tests/test_linked_list.py
    description: "Singly linked list with append, prepend, delete, search, reverse, size"
    min_tests: 10
